<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- soft decorative circles -->
  <circle cx="1120" cy="80" r="260" fill="#fff" opacity="0.06"/>
  <circle cx="900" cy="640" r="200" fill="#fff" opacity="0.05"/>

  <!-- cards -->
  <g transform="translate(1030 320) scale(1.25)">
    <rect x="-110" y="-150" width="220" height="300" rx="32" fill="#fff" opacity="0.4" transform="rotate(-10)"/>
    <rect x="-110" y="-138" width="220" height="300" rx="32" fill="#1E1B4B" opacity="0.2" transform="rotate(7)"/>
    <g transform="rotate(7)">
      <rect x="-110" y="-150" width="220" height="300" rx="32" fill="#fff"/>
      <path d="M 47.5 -39.8 A 62 62 0 1 0 47.5 39.8" fill="none" stroke="#6366F1" stroke-width="34" stroke-linecap="round"/>
      <rect x="-60" y="90" width="120" height="14" rx="7" fill="#C7D2FE"/>
      <rect x="-60" y="116" width="76" height="14" rx="7" fill="#E0E7FF"/>
    </g>
  </g>

  <!-- text -->
  <g font-family="Inter, 'Helvetica Neue', Arial, sans-serif" fill="#fff">
    <text x="80" y="255" font-size="124" font-weight="800" letter-spacing="-3">Cardly</text>
    <text x="84" y="335" font-size="42" font-weight="600">Anki in your browser.</text>
    <text x="84" y="388" font-size="42" font-weight="400" opacity="0.92">Free, self-hosted, works on iPhone.</text>

    <!-- chips -->
    <g font-size="26" font-weight="600" text-anchor="middle">
      <rect x="84" y="445" width="110" height="52" rx="26" fill="#fff" opacity="0.2"/>
      <text x="139" y="480">FSRS</text>
      <rect x="208" y="445" width="150" height="52" rx="26" fill="#fff" opacity="0.2"/>
      <text x="283" y="480">AI cards</text>
      <rect x="372" y="445" width="100" height="52" rx="26" fill="#fff" opacity="0.2"/>
      <text x="422" y="480">PWA</text>
      <rect x="486" y="445" width="150" height="52" rx="26" fill="#fff" opacity="0.2"/>
      <text x="561" y="480">AGPL-3.0</text>
    </g>

    <text x="84" y="574" font-size="20" font-weight="400" opacity="0.7">Open source · Not affiliated with Anki or Ankitects</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
