name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docker-release:
    name: Build & Push GHCR Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=tag
            type=raw,value=latest,enable=${{ !contains(github.ref, '-rc') && !contains(github.ref, '-beta') && !contains(github.ref, '-alpha') }}
          labels: |
            org.opencontainers.image.title=Cardly
            org.opencontainers.image.description=Anki Desktop web client & sync server
            org.opencontainers.image.vendor=Cardly contributors
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    name: Create GitHub Release Draft
    runs-on: ubuntu-latest
    needs: [docker-release]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub Release Draft
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
          generate_release_notes: true
          name: Cardly ${{ github.ref_name }}
          body: |
            ## 🚀 Cardly ${{ github.ref_name }}

            Cardly is an Anki-compatible web client and sync server running directly in modern web browsers and mobile devices.

            ### 🐳 Pre-built Docker Image (GHCR)

            Pull and run the pre-built Docker container from GitHub Container Registry:

            ```bash
            docker pull ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ```

            #### Quickstart with Docker Compose:
            ```yaml
            services:
              cardly:
                image: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
                container_name: cardly
                restart: unless-stopped
                ports:
                  - "8080:8080"
                environment:
                  CARDLY_HOST: "0.0.0.0"
                  CARDLY_PORT: "8080"
                  CARDLY_USER1: "alice:change-me-please"
                  SYNC_USER1: "alice:change-me-please"
                volumes:
                  - cardly_data:/data

            volumes:
              cardly_data:
            ```

            ### 📱 AnkiDroid & AnkiMobile Sync Configuration
            - **Custom Sync URL:** `http://<your-server-ip>:8080/sync/`
            - **Media Sync URL:** `http://<your-server-ip>:8080/msync/`
