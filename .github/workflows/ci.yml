name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "landing/**"
      - "**.png"
      - "**.svg"
      - "deploy/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "landing/**"
      - "**.png"
      - "**.svg"
      - "deploy/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-tests:
    name: Rust Server Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            gcc \
            g++ \
            make \
            ninja-build \
            pkg-config \
            protobuf-compiler \
            rsync

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "server -> target"

      - name: Build upstream proto descriptors & web assets
        run: |
          cd anki-upstream
          export PROTOC_BINARY=/usr/bin/protoc
          ./ninja ts:sveltekit qt:aqt:data:web

      - name: Run Rust server tests
        run: |
          cd server
          cargo test --verbose

  svelte-check-build:
    name: Svelte 5 Type Check & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates \
            ninja-build \
            protobuf-compiler

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: "web/package-lock.json"

      - name: Generate upstream TypeScript protobuf bindings
        run: |
          cd anki-upstream
          export PROTOC_BINARY=/usr/bin/protoc
          ./ninja ts:sveltekit

      - name: Install web dependencies
        run: |
          cd web
          npm ci

      - name: Run Svelte type check (svelte-check)
        run: |
          cd web
          npm run check

      - name: Build Svelte 5 web shell
        run: |
          cd web
          npm run build

      - name: Upload web shell dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 7

  e2e-tests:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    needs: [rust-tests, svelte-check-build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Cardly Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: cardly:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start Cardly container
        run: |
          docker run -d --name cardly-ci \
            -p 8091:8080 \
            -e CARDLY_USER1="alice:secret123" \
            -e SYNC_USER1="alice:secret123" \
            -e CARDLY_HOST="0.0.0.0" \
            -e CARDLY_PORT="8080" \
            -e RUST_LOG="cardly_server=info,anki=info" \
            cardly:ci

      - name: Wait for Cardly server healthcheck
        run: |
          echo "Waiting for Cardly server on http://127.0.0.1:8091/healthz..."
          for i in $(seq 1 45); do
            if curl -s -f http://127.0.0.1:8091/healthz > /dev/null 2>&1; then
              echo "Cardly server is healthy! (attempt $i)"
              exit 0
            fi
            echo "Waiting for server to become ready ($i/45)..."
            sleep 2
          done
          echo "Cardly server healthcheck timed out! Container logs:"
          docker logs cardly-ci
          exit 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: "e2e/package-lock.json"

      - name: Install E2E dependencies & Playwright browsers
        run: |
          cd e2e
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        env:
          CARDLY_BASE_URL: "http://127.0.0.1:8091"
          CARDLY_TEST_USER: "alice"
          CARDLY_TEST_PASS: "secret123"
        run: |
          cd e2e
          npx playwright test

      - name: Upload Playwright report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14

      - name: Dump container logs on failure
        if: failure()
        run: docker logs cardly-ci
