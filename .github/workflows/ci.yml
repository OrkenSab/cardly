name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "landing/**"
      - "**.png"
      - "**.svg"
      - "deploy/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "landing/**"
      - "**.png"
      - "**.svg"
      - "deploy/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PROTOC: /usr/bin/protoc
  PROTOC_BINARY: /usr/bin/protoc

jobs:
  rust-tests:
    name: Rust Server Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            gcc \
            g++ \
            make \
            ninja-build \
            pkg-config \
            protobuf-compiler \
            rsync

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "server -> target"

      - name: Run Rust server tests
        run: |
          cd server
          cargo test --verbose

      - name: Build server binary for E2E
        run: |
          cd server
          cargo build

      - name: Build upstream web assets
        run: |
          cd anki-upstream
          ./ninja qt:aqt:data:web

      - name: Upload server binary
        uses: actions/upload-artifact@v4
        with:
          name: cardly-server-bin
          path: server/target/debug/cardly-server
          retention-days: 1

      - name: Upload upstream web assets
        uses: actions/upload-artifact@v4
        with:
          name: upstream-web-dist
          path: anki-upstream/out/qt/_aqt/data/web
          retention-days: 1

  svelte-check-build:
    name: Svelte 5 Type Check & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: "web/package-lock.json"

      - name: Install web dependencies
        run: |
          cd web
          npm ci

      - name: Run Svelte type check (svelte-check)
        run: |
          cd web
          npm run check

      - name: Build Svelte 5 web shell
        run: |
          cd web
          npm run build

      - name: Upload web shell dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 7

  e2e-tests:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    needs: [rust-tests, svelte-check-build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download server binary
        uses: actions/download-artifact@v4
        with:
          name: cardly-server-bin
          path: server/target/debug

      - name: Make server binary executable
        run: chmod +x server/target/debug/cardly-server

      - name: Download upstream web assets
        uses: actions/download-artifact@v4
        with:
          name: upstream-web-dist
          path: anki-upstream/out/qt/_aqt/data/web

      - name: Download web shell dist artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: "e2e/package-lock.json"

      - name: Install E2E dependencies & Playwright browsers
        run: |
          cd e2e
          npm ci
          npx playwright install --with-deps chromium

      - name: Start Cardly server
        run: |
          mkdir -p /tmp/cardly_e2e_data
          CARDLY_PORT=8091 \
          CARDLY_USER1="alice:secret123" \
          PASSWORDS_HASHED=0 \
          CARDLY_DATA_DIR="/tmp/cardly_e2e_data" \
          CARDLY_SHELL_DIR="web/dist" \
          CARDLY_UPSTREAM_WEB_DIR="anki-upstream/out/qt/_aqt/data/web" \
          server/target/debug/cardly-server &
          echo $! > /tmp/cardly_server.pid

      - name: Wait for Cardly server healthcheck
        run: |
          echo "Waiting for Cardly server on http://127.0.0.1:8091/healthz..."
          for i in $(seq 1 45); do
            if curl -s -f http://127.0.0.1:8091/healthz > /dev/null 2>&1; then
              echo "Cardly server is healthy! (attempt $i)"
              exit 0
            fi
            echo "Waiting for server to become ready ($i/45)..."
            sleep 1
          done
          echo "Cardly server healthcheck timed out!"
          exit 1

      - name: Run Playwright E2E tests
        env:
          CARDLY_BASE_URL: "http://127.0.0.1:8091"
          CARDLY_TEST_USER: "alice"
          CARDLY_TEST_PASS: "secret123"
        run: |
          cd e2e
          npx playwright test

      - name: Stop Cardly server
        if: always()
        run: |
          if [ -f /tmp/cardly_server.pid ]; then
            kill $(cat /tmp/cardly_server.pid) 2>/dev/null || true
          fi

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14
