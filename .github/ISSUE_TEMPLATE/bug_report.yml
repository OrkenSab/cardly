name: 🐛 Bug Report
description: Report a reproducible problem, rendering defect, or unexpected behavior in Cardly
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        ### Thank you for reporting an issue!
        Please review existing open issues and check [docs/PARITY.md](docs/PARITY.md) before submitting.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the defect or error clearly...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Detailed, sequential steps to reproduce the issue from a fresh session.
      placeholder: |
        1. Open Cardly at http://localhost:8080
        2. Sign in as user 'alice'
        3. Navigate to Browser (press 'B')
        4. Click on 'Tags' sidebar and select tag 'math'
        5. Observe unexpected error or blank pane
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen? How does Desktop Anki behave in the same scenario?
      placeholder: Describe the expected behavior matching desktop Anki...
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or Screen Recordings
      description: Attach screenshots or recordings illustrating the bug (especially for UI / mobile responsive issues).
    validations:
      required: false
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment Method
      description: How is your Cardly instance deployed?
      options:
        - Docker Compose (Standard / Recommended)
        - GHCR Pre-built Docker Image (ghcr.io)
        - Custom Docker Build
        - Bare Metal (Cargo + Node/Svelte build)
        - Other (explain in logs / context)
    validations:
      required: true
  - type: dropdown
    id: client-platform
    attributes:
      label: Client Browser & Operating System
      description: Which browser and OS are you using to access the Cardly interface?
      options:
        - Chrome / Chromium (Desktop)
        - Firefox (Desktop)
        - Safari (macOS)
        - Edge (Desktop)
        - iOS Safari / PWA (Mobile)
        - Android Chrome / PWA (Mobile)
        - AnkiDroid (Sync Server client)
        - AnkiMobile (Sync Server client)
        - Other (specify below)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Cardly Version or Git Commit
      description: Version number from release tag (e.g., v0.1.0) or git commit hash (`git rev-parse HEAD`).
      placeholder: "v0.1.0 (commit abc1234)"
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant Server or Browser Console Logs
      description: Paste any server terminal output or browser DevTools console errors. Please redact any sensitive passwords or tokens.
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: confirmation
    attributes:
      label: Checklist
      options:
        - label: I searched the issue tracker and confirmed this has not been reported already.
          required: true
        - label: I have verified this behavior against official Anki Desktop if applicable.
          required: false
