<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 72" width="320" height="72">
  <defs>
    <linearGradient id="logoBackGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <linearGradient id="logoFrontGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="60%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <linearGradient id="logoSparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <filter id="logoShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Left Emblem (54x54 scaled down from 512x512) -->
  <g transform="translate(10, 9) scale(0.105)">
    <!-- Back card -->
    <g transform="translate(256, 256) rotate(-7) translate(-256, -256)" opacity="0.85">
      <rect x="96" y="96" width="300" height="320" rx="36" fill="url(#logoBackGrad)" stroke="#38BDF8" stroke-width="6" stroke-opacity="0.6"/>
      <rect x="136" y="146" width="130" height="16" rx="8" fill="#64748B" opacity="0.5"/>
      <rect x="136" y="176" width="200" height="12" rx="6" fill="#64748B" opacity="0.4"/>
    </g>

    <!-- Front card -->
    <g filter="url(#logoShadow)">
      <rect x="116" y="116" width="300" height="320" rx="36" fill="url(#logoFrontGrad)"/>
      <rect x="126" y="126" width="280" height="300" rx="28" fill="#FFFFFF"/>
      <rect x="160" y="160" width="84" height="22" rx="11" fill="#DBEAFE"/>
      <rect x="172" y="167" width="60" height="8" rx="4" fill="#2563EB"/>
      <rect x="160" y="210" width="212" height="18" rx="9" fill="#0F172A"/>
      <rect x="160" y="246" width="160" height="12" rx="6" fill="#64748B" opacity="0.6"/>
      <line x1="160" y1="310" x2="372" y2="310" stroke="#E2E8F0" stroke-width="4" stroke-linecap="round"/>
      <rect x="160" y="342" width="50" height="24" rx="12" fill="#FEE2E2"/>
      <rect x="220" y="342" width="60" height="24" rx="12" fill="#DCFCE7"/>
      <rect x="290" y="342" width="56" height="24" rx="12" fill="#E0F2FE"/>
    </g>

    <!-- Spark -->
    <g transform="translate(390, 116)">
      <path d="M 0 -44 Q 0 0 44 0 Q 0 0 0 44 Q 0 0 -44 0 Q 0 0 0 -44 Z" fill="url(#logoSparkGrad)"/>
      <circle cx="0" cy="0" r="10" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- Wordmark Text -->
  <text x="74" y="49" font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5px">
    <tspan fill="#0F172A">Card</tspan><tspan fill="#2563EB">ly</tspan>
  </text>

  <!-- Tagline pill or subtitle -->
  <rect x="206" y="24" width="64" height="16" rx="8" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
  <text x="238" y="35.5" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#2563EB" text-anchor="middle" letter-spacing="0.5px">ANKI-CORE</text>
</svg>
