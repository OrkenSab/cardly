<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="maskableBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background for adaptive masking -->
  <rect width="512" height="512" fill="url(#maskableBg)"/>

  <!-- Centered scaled cards (within 80% safe zone) -->
  <g transform="translate(256, 256) scale(0.78) translate(-256, -256)">
    <!-- back card -->
    <rect x="146" y="106" width="220" height="300" rx="32" fill="#FFFFFF" opacity="0.4" transform="rotate(-10 256 256)"/>

    <!-- front card shadow -->
    <rect x="146" y="118" width="220" height="300" rx="32" fill="#1E1B4B" opacity="0.18" transform="rotate(7 256 256)"/>

    <!-- front card -->
    <g transform="rotate(7 256 256)">
      <rect x="146" y="106" width="220" height="300" rx="32" fill="#FFFFFF"/>
      <path d="M 303.5 216.2 A 62 62 0 1 0 303.5 295.8" fill="none" stroke="#6366F1" stroke-width="34" stroke-linecap="round"/>
      <rect x="196" y="346" width="120" height="14" rx="7" fill="#C7D2FE"/>
      <rect x="196" y="372" width="76" height="14" rx="7" fill="#E0E7FF"/>
    </g>
  </g>
</svg>
