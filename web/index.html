<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Cardly — Open-Source Anki Web Client & Sync Server</title>

    <!-- Primary Meta Tags -->
    <meta name="title" content="Cardly — Open-Source Anki Web Client & Sync Server" />
    <meta
      name="description"
      content="Cardly is an Anki-compatible spaced repetition web client with FSRS scheduler, offline PWA support, and built-in sync server."
    />
    <meta name="theme-color" content="#2563eb" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Cardly" />
    <meta property="og:title" content="Cardly — Open-Source Anki Web Client & Sync Server" />
    <meta
      property="og:description"
      content="The open-source spaced repetition app for web and mobile. Anki Desktop compatible with FSRS scheduler, offline PWA, and direct AnkiDroid sync."
    />
    <meta property="og:image" content="https://orkensab.github.io/cardly/assets/social-preview.png" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="640" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Cardly — Open-Source Anki Web Client & Sync Server" />
    <meta
      name="twitter:description"
      content="The open-source spaced repetition app for web and mobile. Anki Desktop compatible with FSRS scheduler, offline PWA, and direct AnkiDroid sync."
    />
    <meta name="twitter:image" content="https://orkensab.github.io/cardly/assets/social-preview.png" />

    <!-- Apple & PWA Meta -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cardly" />

    <!-- Favicons & Icons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/svg+xml" href="/cardly-icon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body class="fancy">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
