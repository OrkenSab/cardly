# fly.toml app configuration file for Cardly
# Deploying to Fly.io with persistent NVMe volume on /data

app = "cardly"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  CARDLY_HOST = "0.0.0.0"
  CARDLY_PORT = "8080"
  CARDLY_DATA_DIR = "/data"
  CARDLY_UPSTREAM_WEB_DIR = "/app/web-upstream"
  CARDLY_SHELL_DIR = "/app/web-shell"
  CARDLY_COOKIE_SECURE = "true"
  RUST_LOG = "cardly_server=info,anki=info"

[mounts]
  source = "cardly_data"
  destination = "/data"
  initial_size = "5gb"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 250
    hard_limit = 500

[[http_service.checks]]
  grace_period = "15s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/healthz"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
